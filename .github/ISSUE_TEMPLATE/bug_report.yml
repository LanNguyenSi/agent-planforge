name: Bug report
description: Report a defect or regression in planner behavior or generated artifacts
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input or configuration
      description: Input file, config override, planner profile, etc.
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      render: bash
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit SHA
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
