name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  cli:
    # The CLI keeps its Node 18/20 matrix — it's pure CommonJS and we
    # want to know if a dependency upgrade ever breaks 18 for callers
    # still on the older LTS.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CLI tests
        run: npm run test:cli

      - name: Validate sample planning input
        run: node scripts/bootstrap-plan.js --input examples/sample-input.json --outdir out/ci-sample --validate-only

      - name: Generate platform summary
        run: node scripts/bootstrap-plan.js --input examples/platform-input.json --outdir out/ci-platform --summary

      - name: Check working tree cleanliness
        run: git diff --exit-code

  server:
    # The HTTP service sub-package ships TypeScript + Hono and targets
    # Node ≥20 (matches agent-relay / agent-tasks). It has its own npm
    # install under `server/` because it's a separate package — the
    # root `npm ci` doesn't reach into sub-packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Typecheck server
        run: npm run typecheck --prefix server

      - name: Build server
        run: npm run build --prefix server

      - name: Run server tests
        run: npm run test:server

  docker:
    # Validate the full image builds end-to-end: node server + TS output +
    # CLI + scaffoldkit Python venv + blueprint source tree. The smoke
    # asserts scaffoldkit is wired correctly by invoking it the same way
    # the HTTP service does at runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          tags: agent-planforge:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scaffoldkit CLI smoke via venv python
        run: |
          docker run --rm --entrypoint /opt/sk-venv/bin/python3 \
            agent-planforge:ci -m scaffoldkit.cli --help

      - name: Scaffoldkit CLI smoke via PATH
        run: |
          docker run --rm --entrypoint scaffoldkit \
            agent-planforge:ci --help

      - name: HTTP service boots + healthz green
        run: |
          docker run -d --name planforge-smoke \
            -e PLANFORGE_SERVICE_TOKEN=ci-token \
            -p 18223:8223 \
            agent-planforge:ci
          for i in 1 2 3 4 5; do
            sleep 2
            if curl -fsS http://localhost:18223/healthz; then echo; exit 0; fi
          done
          echo "healthz never came up"
          docker logs planforge-smoke
          exit 1

      - name: Image size report
        run: docker images agent-planforge:ci --format '{{.Size}}'
