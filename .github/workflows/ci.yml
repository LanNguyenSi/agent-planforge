name: CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Validate sample planning input
        run: node scripts/bootstrap-plan.js --input examples/sample-input.json --outdir out/ci-sample --validate-only

      - name: Generate platform summary
        run: node scripts/bootstrap-plan.js --input examples/platform-input.json --outdir out/ci-platform --summary

      - name: Check working tree cleanliness
        run: git diff --exit-code
